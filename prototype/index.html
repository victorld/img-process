<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>img-process 管理台登录</title>
  <style>
    :root {
      --bg: oklch(97.5% 0.008 245);
      --surface: oklch(100% 0 0);
      --surface-soft: oklch(98.2% 0.006 245);
      --fg: oklch(20% 0.025 250);
      --muted: oklch(52% 0.02 250);
      --border: oklch(89% 0.01 250);
      --accent: oklch(56% 0.13 158);
      --accent-strong: oklch(43% 0.12 158);
      --accent-soft: oklch(94% 0.035 158);
      --danger: oklch(58% 0.16 28);
      --nav: oklch(21% 0.035 250);
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--fg);
      font: 14px/1.55 var(--font-body);
      -webkit-font-smoothing: antialiased;
      background:
        linear-gradient(135deg, color-mix(in oklch, var(--bg), white 70%) 0%, var(--bg) 52%, oklch(95% 0.014 235) 100%),
        radial-gradient(circle at 30% 18%, color-mix(in oklch, var(--accent-soft), transparent 4%), transparent 31%),
        radial-gradient(circle at 76% 72%, color-mix(in oklch, oklch(92% 0.035 230), transparent 16%), transparent 34%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(color-mix(in oklch, var(--border), transparent 54%) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in oklch, var(--border), transparent 54%) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
      opacity: 0.36;
    }

    button, input { font: inherit; }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(22px, 4vw, 44px);
    }

    .form-panel {
      width: min(488px, 100%);
      display: grid;
      justify-items: center;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .login-stack {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 22px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      width: 100%;
    }

    .login-logo {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), oklch(59% 0.13 230));
      color: white;
      font: 850 14px/1 var(--font-mono);
      box-shadow: 0 12px 28px rgba(30, 115, 91, 0.18);
    }

    .brand-text {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .brand-text strong {
      font: 850 20px/1.1 var(--font-display);
      letter-spacing: 0;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
    }

    .login-card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in oklch, var(--surface), transparent 2%);
      box-shadow: 0 24px 70px rgba(20, 30, 45, 0.12);
      overflow: hidden;
    }

    .card-head {
      display: grid;
      justify-items: start;
      text-align: left;
      padding: 30px 34px 24px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(180deg, color-mix(in oklch, white, var(--accent-soft) 12%), var(--surface-soft)),
        linear-gradient(90deg, var(--accent), oklch(58% 0.13 225));
      background-size: 100% 100%, 100% 4px;
      background-repeat: no-repeat;
      background-position: 0 0, 0 0;
    }

    .card-head h2 {
      margin: 0;
      font: 850 25px/1.15 var(--font-display);
      letter-spacing: 0;
    }

    .card-head p {
      margin: 10px auto 0;
      color: var(--muted);
      max-width: 25em;
    }

    .login-form {
      display: grid;
      gap: 17px;
      padding: 30px 34px 34px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      background: white;
      color: var(--fg);
      outline: 0;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: color-mix(in oklch, var(--accent), white 18%);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent-soft), transparent 20%);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .remember input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      accent-color: var(--accent-strong);
    }

    .primary {
      min-height: 46px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: var(--accent-strong);
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .primary:hover {
      transform: translateY(-1px);
      background: color-mix(in oklch, var(--accent-strong), black 8%);
    }

    .error {
      display: none;
      border: 1px solid color-mix(in oklch, var(--danger), white 38%);
      border-radius: 8px;
      padding: 11px 12px;
      background: color-mix(in oklch, var(--danger), white 88%);
      color: color-mix(in oklch, var(--danger), black 12%);
      font-size: 13px;
      font-weight: 700;
    }

    .error.visible { display: block; }

    @media (max-width: 860px) {
      body { background: var(--bg); }
      .login-shell { padding: 22px; }
      .login-stack { gap: 18px; }
      .brand-lockup { justify-content: flex-start; }
      .card-head { padding: 26px 24px 22px; }
      .login-form { padding: 24px; }
    }
  </style>
</head>
<body>
  <main class="login-shell" data-od-id="path-0">
    <section class="form-panel" aria-label="登录">
      <div class="login-stack">
        <form class="login-card" id="login-form">
          <div class="card-head">
            <div class="brand-lockup" aria-label="img-process">
              <div class="login-logo">IP</div>
              <div class="brand-text">
                <strong>img-process</strong>
                <span>图片治理与扫描任务管理</span>
              </div>
            </div>
          </div>
          <div class="login-form">
            <label for="username">
              用户名
              <input id="username" name="username" autocomplete="username" placeholder="请输入用户名">
            </label>
            <label for="password">
              密码
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
            </label>
            <div class="row">
              <label class="remember" for="remember">
                <input id="remember" type="checkbox" checked>
                记住登录状态
              </label>
            </div>
            <div class="error" id="error" role="alert">请输入用户名和密码后继续。</div>
            <button class="primary" id="login-button" type="button">登录工作台</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var user = document.getElementById('username');
      var pass = document.getElementById('password');
      var error = document.getElementById('error');
      var button = document.getElementById('login-button');

      function enterDashboard() {
        window.location.assign('screens/dashboard.html');
      }

      function clearError() {
        error.classList.remove('visible');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        enterDashboard();
      });

      button.addEventListener('click', enterDashboard);
      user.addEventListener('input', clearError);
      pass.addEventListener('input', clearError);
    })();
  </script>


</body></html>
