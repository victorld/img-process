services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: "no"
    environment:
      IMG_PROCESS_CONFIG: /app/config.yaml
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./log:/app/log
      - /Users/ld/my-file/pic-lib/pic-new:/data/pic-new
      - /Volumes/mount/personal_folder/pic-lib/pic-new:/data/pic-new-bak
